# TestFlight'a imzalı yükleme. house-control'ün scripts/build-ios.sh --upload akışının CI uyarlaması.
# Yalnızca elle çalışır (Actions > TestFlight > Run workflow). Gerekli secrets:
#   APPLE_TEAM_ID   Developer hesabındaki 10 karakterlik Team ID
#   ASC_KEY_ID      App Store Connect API anahtarının Key ID'si (rol: Admin, bulut imzalama için)
#   ASC_ISSUER_ID   Anahtar listesinin üstündeki Issuer ID
#   ASC_KEY_P8      AuthKey_<id>.p8 dosyasının base64 hali
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 28 Nisan 2026'dan beri App Store Connect yalnızca Xcode 26+ ile derlenmiş yüklemeleri kabul ediyor.
      - name: Xcode 26 veya üstü
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: API anahtarı
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Arşivle ve TestFlight'a yükle
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project Bulutsuz.xcodeproj -scheme Bulutsuz -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Bulutsuz.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d build/Bulutsuz.xcarchive
          # destination=upload: dışa aktarırken doğrudan App Store Connect'e gönderir.
          xcodebuild -exportArchive -archivePath build/Bulutsuz.xcarchive -exportPath build/export \
            -exportOptionsPlist Config/ExportOptions.plist "${AUTH[@]}" 2>&1 | tee export.log \
            | grep -E "error|EXPORT|Upload" || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Hata özeti
        if: failure()
        run: grep -hE "error:|error " archive.log export.log 2>/dev/null | sort -u | head -60 || true
