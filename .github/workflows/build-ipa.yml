name: İmzasız IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild \
            -project Bulutsuz.xcodeproj \
            -scheme Bulutsuz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/Bulutsuz.app

      - name: Hata özeti
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Bulutsuz.app Payload/
          ls Payload/Bulutsuz.app/PlugIns Payload/Bulutsuz.app/Frameworks
          zip -qry Bulutsuz-unsigned.ipa Payload
          ls -lh Bulutsuz-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Bulutsuz-unsigned-ipa
          path: Bulutsuz-unsigned.ipa

      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: İmzasız IPA ${{ github.run_number }}
          prerelease: true
          files: Bulutsuz-unsigned.ipa
          body: iloader / SideStore / AltStore ile kendi Apple ID'nizle imzalayıp yükleyin.
